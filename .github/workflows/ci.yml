name: Prompt Wars CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-unit-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check production build
        run: npm run build
      - name: Test round rubrics, event rules and schema contracts
        run: npm run test:unit
      - name: Test RLS, triggers and RPCs in Postgres (PGlite, no Supabase project)
        run: npm run test:db
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test signed-out UI and the demo-mode event workflow
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Optional: real Supabase RLS checks against a dedicated STAGING project (never the live event).
  # Enable by setting repository variable PW_RUN_SUPABASE_TESTS=1 and the PW_TEST_* secrets.
  supabase-staging:
    if: ${{ vars.PW_RUN_SUPABASE_TESTS == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test staging Supabase RLS with a student test account
        run: npm run test:supabase
        env:
          PW_RUN_SUPABASE_TESTS: '1'
          PW_TEST_SUPABASE_URL: ${{ secrets.PW_TEST_SUPABASE_URL }}
          PW_TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PW_TEST_SUPABASE_PUBLISHABLE_KEY }}
          PW_TEST_STUDENT_EMAIL: ${{ secrets.PW_TEST_STUDENT_EMAIL }}
          PW_TEST_STUDENT_PASSWORD: ${{ secrets.PW_TEST_STUDENT_PASSWORD }}
